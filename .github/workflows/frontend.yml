name: Frontend verification

on:
  push:
    branches: [main, release/sankofa-v0.2]
  pull_request:
    paths: ['frontend/**', '.github/workflows/frontend.yml']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test

  tag-alpha:
    if: github.event_name == 'push' && github.ref == 'refs/heads/release/sankofa-v0.2'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag the verified alpha release
        shell: bash
        run: |
          if git show-ref --verify --quiet refs/tags/v0.2.0-alpha; then
            echo 'v0.2.0-alpha already exists; leaving it unchanged.'
          else
            git tag v0.2.0-alpha
            git push origin refs/tags/v0.2.0-alpha
          fi
