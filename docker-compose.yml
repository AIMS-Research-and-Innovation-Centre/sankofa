services:
  neo4j:
    image: neo4j:5.24
    ports:
      - "7475:7474"   # HTTP UI  → http://localhost:7475
      - "7688:7687"   # Bolt     → bolt://localhost:7688
    environment:
      NEO4J_AUTH: neo4j/livingarchive
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7474"]
      interval: 10s
      retries: 12

  qdrant:
    image: qdrant/qdrant:v1.11.0
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  neo4j_data:
  qdrant_data:
