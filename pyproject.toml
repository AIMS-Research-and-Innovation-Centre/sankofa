[project]
name = "sankofa"
version = "0.1.0a0"
description = "Sankofa — an agential thesis archive for AIMS"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "neo4j>=5.24",
    "qdrant-client>=1.11,<1.12",
    "sentence-transformers>=3.1",
    "pymupdf>=1.24",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "structlog>=24.4",
    "orjson>=3.10",
    "numpy>=2.0",
    "typer>=0.12",
    "prompt_toolkit>=3.0.47",
    "rich>=13.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
sankofa = "sankofa.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sankofa"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
